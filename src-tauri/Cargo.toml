[package]
name = "desktop-pet"
version = "0.2.0"
edition = "2021"
description = "MoJu Desktop Pet — 基于 Tauri v2 的像素桌面宠物，支持多精灵切换、多屏跨屏漫游、AI 追逐/逃离"
authors = ["MoJu Tech"]
license = "MIT"
repository = "https://github.com/oDen7/DesktopPet"
homepage = "https://gitee.com/MoJu-Tech/desktop-pet"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
windows = { version = "0.58", features = ["Win32_Graphics_Gdi"] }
