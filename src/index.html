<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./pet.less">
</head>
<body>
  <div id="pet" class="pet-idle"></div>

  <script>
    const { invoke, convertFileSrc } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const petEl = document.getElementById('pet');
    const DISPLAY_SIZE = 128;
    let frameH = 128;

    let currentState = 'idle';
    let currentX = 0, currentY = 0;
    let displays = [{ x: 0, y: 0, w: 1920, h: 1032 }];
    let aiEnabled = true, followEnabled = false;
    let isDragging = false, hasMoved = false, isFalling = false;
    let fallVelocity = 0;
    let dragStartScreenX = 0, dragStartScreenY = 0;
    let dragBaseX = 0, dragBaseY = 0, dragBaseReady = false;
    let windowStartX = 0, windowStartY = 0;
    let speed = 1.5;
    const BASE_SPEED = 1.5;
    const GRAVITY = 0.8;
    const FOLLOW_SPEED = 3.5;

    // ---- Cursor poll (Rust provides global pos) ----
    let mouseX = -999, mouseY = -999;
    setInterval(async () => {
      try { const p = await invoke('get_cursor_pos'); mouseX = p.x; mouseY = p.y; } catch (_) {}
    }, 50);

    // ---- Events ----
    listen('current-pos', (e) => {
      currentX = e.payload.currentX; currentY = e.payload.currentY;
      if (e.payload.displays) displays = e.payload.displays;
      // Safety net: if Rust had to clamp, angle-reflect bounce
      if (e.payload.blockedX || e.payload.blockedY) {
        handleWallBounce(
          e.payload.blockedX && currentVelocity.x < 0,
          e.payload.blockedX && currentVelocity.x > 0,
          e.payload.blockedY && currentVelocity.y < 0,
          e.payload.blockedY && currentVelocity.y > 0,
        );
      }
    });
    listen('window-position', (e) => {
      windowStartX = e.payload.x; windowStartY = e.payload.y;
      if (e.payload.displays) displays = e.payload.displays;
    });
    listen('settings-changed', (e) => {
      const s = e.payload;
      aiEnabled = s.ai_enabled; followEnabled = s.follow_enabled;
      speed = BASE_SPEED * s.speed_multiplier;
      // Apply new speed to current velocity immediately
      const vm = Math.sqrt(currentVelocity.x * currentVelocity.x + currentVelocity.y * currentVelocity.y);
      if (vm > 0.01) {
        currentVelocity.x = currentVelocity.x / vm * speed;
        currentVelocity.y = currentVelocity.y / vm * speed;
      }
      if (aiEnabled && !followEnabled) {
        scheduleBrain();
      } else {
        if (brainTimer) { clearTimeout(brainTimer); brainTimer = null; }
        changeState('idle');
      }
      if (s.sprite) applySprite(s.sprite);
    });

    // ---- State rendering ----
    function changeState(newState) {
      currentState = newState;
      const isWalking = newState !== 'idle' && newState !== 'drag' && newState !== 'fall';
      if (isWalking) {
        const speedRatio = Math.min(speed / BASE_SPEED, 4);
        petEl.style.animationDuration = (0.6 / Math.sqrt(speedRatio)) + 's';
      } else {
        petEl.style.animationDuration = '';
      }

      const row = petEl._rowY || [0, -frameH, -2*frameH, -3*frameH];
      if (newState.includes('left')) { petEl.className = 'pet-walk-left'; petEl.style.backgroundPositionY = row[1] + 'px'; }
      else if (newState.includes('right')) { petEl.className = 'pet-walk-right'; petEl.style.backgroundPositionY = row[1] + 'px'; }
      else if (newState === 'walk-up' || newState === 'walk-down') { petEl.className = 'pet-walk-right'; petEl.style.backgroundPositionY = row[1] + 'px'; }
      else if (newState === 'drag') { petEl.className = 'pet-drag'; petEl.style.backgroundPositionY = row[2] + 'px'; }
      else if (newState === 'fall') { petEl.className = 'pet-fall'; petEl.style.backgroundPositionY = row[3] + 'px'; }
      else { petEl.className = 'pet-' + newState; petEl.style.backgroundPositionY = row[0] + 'px'; }
    }

    // ---- AI Brain 4.0 (step-based plan + wobble) ----
    const MARGIN = 200;
    const GAP = 50; // generous tolerance for DPI / monitor offset mismatches
    const WALK_DIRS = ['walk-left','walk-up-left','walk-up','walk-up-right',
                       'walk-right','walk-down-right','walk-down','walk-down-left'];
    const DIR_VEC = {
      'walk-left':[-1,0], 'walk-right':[1,0], 'walk-up':[0,-1], 'walk-down':[0,1],
      'walk-up-left':[-0.7071,-0.7071], 'walk-up-right':[0.7071,-0.7071],
      'walk-down-left':[-0.7071,0.7071], 'walk-down-right':[0.7071,0.7071]
    };

    let currentVelocity = { x: 0, y: 0 };
    let currentPlan = { direction: 'idle', totalSteps: 0, currentStep: 0, isPause: false };

    function dirToAngle(dir) {
      switch (dir) {
        case 'walk-left': return Math.PI;
        case 'walk-up-left': return Math.PI * 0.75;
        case 'walk-up': return Math.PI * 0.5;
        case 'walk-up-right': return Math.PI * 0.25;
        case 'walk-right': return 0;
        case 'walk-down-right': return -Math.PI * 0.25;
        case 'walk-down': return -Math.PI * 0.5;
        case 'walk-down-left': return -Math.PI * 0.75;
        default: return 0;
      }
    }

    function reflectDir(dir, bl, br, bu, bd) {
      const rx = { 'walk-left':'walk-right','walk-right':'walk-left',
        'walk-up-left':'walk-up-right','walk-up-right':'walk-up-left',
        'walk-down-left':'walk-down-right','walk-down-right':'walk-down-left' };
      const ry = { 'walk-up':'walk-down','walk-down':'walk-up',
        'walk-up-left':'walk-down-left','walk-up-right':'walk-down-right',
        'walk-down-left':'walk-up-left','walk-down-right':'walk-up-right' };
      if (bl || br) dir = rx[dir] || dir;
      if (bu || bd) dir = ry[dir] || dir;
      return dir;
    }

    let lastSpriteChange = 0;
    function updateSpriteDirection(vx, vy) {
      if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) {
        if (currentState !== 'idle') changeState('idle');
        return;
      }
      const now = Date.now();
      if (now - lastSpriteChange < 150) return;
      const deg = Math.atan2(vy, vx) * 180 / Math.PI;
      let state;
      if (deg > 157.5 || deg <= -157.5) state = 'walk-left';
      else if (deg > 112.5) state = 'walk-up-left';
      else if (deg > 67.5) state = 'walk-up';
      else if (deg > 22.5) state = 'walk-up-right';
      else if (deg > -22.5) state = 'walk-right';
      else if (deg > -67.5) state = 'walk-down-right';
      else if (deg > -112.5) state = 'walk-down';
      else state = 'walk-down-left';
      if (currentState !== state) { changeState(state); lastSpriteChange = now; }
    }

    // ---- Multi-display helpers ----
    function edgeIsSeam(display, side) {
      for (const other of displays) {
        if (other === display) continue;
        const yOverlap = display.y < other.y + other.h && display.y + display.h > other.y;
        const xOverlap = display.x < other.x + other.w && display.x + display.w > other.x;
        switch (side) {
          case 'left':   if (Math.abs(other.x + other.w - display.x) <= GAP && yOverlap) return true; break;
          case 'right':  if (Math.abs(other.x - (display.x + display.w)) <= GAP && yOverlap) return true; break;
          case 'top':    if (Math.abs(other.y + other.h - display.y) <= GAP && xOverlap) return true; break;
          case 'bottom': if (Math.abs(other.y - (display.y + display.h)) <= GAP && xOverlap) return true; break;
        }
      }
      return false;
    }

    function effectiveEdgeDist(cx, cy) {
      let dl = Infinity, dr = Infinity, du = Infinity, dd = Infinity;
      for (const d of displays) {
        if (cx >= d.x - 2 && cx < d.x + d.w + 2 && cy >= d.y - 2 && cy < d.y + d.h + 2) {
          if (!edgeIsSeam(d, 'left'))   dl = Math.min(dl, cx - d.x);
          if (!edgeIsSeam(d, 'right'))  dr = Math.min(dr, d.x + d.w - cx);
          if (!edgeIsSeam(d, 'top'))    du = Math.min(du, cy - d.y);
          if (!edgeIsSeam(d, 'bottom')) dd = Math.min(dd, d.y + d.h - cy);
        }
      }
      return { dl, dr, du, dd };
    }

    function desktopCenter() {
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const d of displays) {
        if (d.x < x1) x1 = d.x; if (d.y < y1) y1 = d.y;
        if (d.x + d.w > x2) x2 = d.x + d.w; if (d.y + d.h > y2) y2 = d.y + d.h;
      }
      return { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
    }

    // ---- Plan-based brain ----
    function smartBrain() {
      if (isDragging || isFalling || !aiEnabled || followEnabled) return;

      const cx = currentX + DISPLAY_SIZE / 2, cy = currentY + DISPLAY_SIZE / 2;
      const e = effectiveEdgeDist(cx, cy);
      const minEdge = Math.min(e.dl, e.dr, e.du, e.dd);
      const nearEdge = minEdge < MARGIN;

      // Walk-rest rhythm: after walking, ~40% chance to rest; never rest twice in a row
      const wasPaused = currentPlan.isPause;
      if (!nearEdge && !wasPaused && Math.random() < 0.4) {
        currentPlan.direction = 'idle';
        currentPlan.totalSteps = 45 + Math.floor(Math.random() * 90); // 1.5~3s
        currentPlan.isPause = true;
        currentPlan.currentStep = 0;
        currentVelocity.x = 0; currentVelocity.y = 0;
        changeState('idle');
        scheduleBrain();
        return;
      }

      // Walk in a discrete 8-direction
      currentPlan.isPause = false;
      currentPlan.totalSteps = 45 + Math.floor(Math.random() * 120); // 1.5~4s
      currentPlan.currentStep = 0;

      // Center direction
      const dc = desktopCenter();
      const toCX = dc.x - cx, toCY = dc.y - cy;
      const distToCenter = Math.sqrt(toCX * toCX + toCY * toCY);
      const dirCX = distToCenter > 1 ? toCX / distToCenter : 0;
      const dirCY = distToCenter > 1 ? toCY / distToCenter : 0;
      const centerStrength = nearEdge
        ? Math.pow(1.0 - minEdge / MARGIN, 2) * 0.8 : 0.05;

      const soft = d => d >= MARGIN ? 1.0 : Math.max(Math.sqrt(d / MARGIN), 0.02);

      const weights = WALK_DIRS.map(dir => {
        let w = 1.0;
        if (dir.includes('left'))  w *= soft(e.dl);
        if (dir.includes('right')) w *= soft(e.dr);
        if (dir.includes('up'))    w *= soft(e.du);
        if (dir.includes('down'))  w *= soft(e.dd);
        const v = DIR_VEC[dir];
        const dot = v[0] * dirCX + v[1] * dirCY;
        w *= 1.0 + Math.tanh(dot * 2) * centerStrength;
        // Slight anti-diagonal bias
        if (v[0] !== 0 && v[1] !== 0) w *= 0.85;
        w *= 0.6 + Math.random() * 0.8;
        return w;
      });

      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < WALK_DIRS.length; i++) {
        r -= weights[i];
        if (r <= 0) { currentPlan.direction = WALK_DIRS[i]; break; }
      }
      if (!currentPlan.direction) currentPlan.direction = WALK_DIRS[0];
      scheduleBrain();
    }

    let brainTimer = null;
    function scheduleBrain() {
      if (brainTimer) clearTimeout(brainTimer);
      const delay = 1500 + Math.random() * 1500;
      brainTimer = setTimeout(() => { smartBrain(); scheduleBrain(); }, delay);
    }
    scheduleBrain();

    // Wall bounce: break plan, reflect discrete direction
    function handleWallBounce(blockedLeft, blockedRight, blockedUp, blockedDown) {
      if (isDragging) return;
      if (isFalling) { isFalling = false; changeState('idle'); return; }
      currentPlan.direction = reflectDir(currentPlan.direction,
        blockedLeft, blockedRight, blockedUp, blockedDown);
      const angle = dirToAngle(currentPlan.direction) + (Math.random() - 0.5) * 0.5;
      currentVelocity.x = Math.cos(angle) * speed;
      currentVelocity.y = Math.sin(angle) * speed;
      currentPlan.totalSteps = 30 + Math.floor(Math.random() * 30);
      currentPlan.currentStep = 0;
      currentPlan.isPause = false;
    }

    function wouldLeaveScreen(dx, dy) {
      const nx = currentX + dx, ny = currentY + dy;
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const d of displays) {
        if (d.x < x1) x1 = d.x; if (d.y < y1) y1 = d.y;
        if (d.x + d.w > x2) x2 = d.x + d.w; if (d.y + d.h > y2) y2 = d.y + d.h;
      }
      if (dx < 0 && nx < x1) return true;
      if (dx > 0 && nx + DISPLAY_SIZE > x2) return true;
      if (dy < 0 && ny < y1) return true;
      if (dy > 0 && ny + DISPLAY_SIZE > y2) return true;
      const cx = nx + DISPLAY_SIZE / 2, cy = ny + DISPLAY_SIZE / 2;
      for (const d of displays) {
        if (cx >= d.x - 2 && cx < d.x + d.w + 2 && cy >= d.y - 2 && cy < d.y + d.h + 2) return false;
      }
      return true;
    }

    function pickFollowDir(px, py, mx, my) {
      const dx = mx - px - DISPLAY_SIZE / 2, dy = my - py - DISPLAY_SIZE / 2;
      const deg = Math.atan2(dy, dx) * 180 / Math.PI;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return 'idle';
      if (deg > 157.5 || deg <= -157.5) return 'walk-left';
      if (deg > 112.5) return 'walk-up-left';
      if (deg > 67.5) return 'walk-up';
      if (deg > 22.5) return 'walk-up-right';
      if (deg > -22.5) return 'walk-right';
      if (deg > -67.5) return 'walk-down-right';
      if (deg > -112.5) return 'walk-down';
      return 'walk-down-left';
    }

    let frameSkip = 0;
    function updateMovement() {
      if (isDragging || menuOpen) return;

      // Falling & following: every frame for smoothness
      if (isFalling) { fallVelocity += GRAVITY; invoke('move_pet', { dx: 0, dy: fallVelocity }); return; }
      if (followEnabled && mouseX !== -999) {
        const tx = mouseX - DISPLAY_SIZE / 2, ty = mouseY - DISPLAY_SIZE / 2;
        const rdx = tx - currentX, rdy = ty - currentY;
        const dist = Math.sqrt(rdx * rdx + rdy * rdy);
        if (dist < 8) { changeState('idle'); return; }
        changeState(pickFollowDir(currentX, currentY, mouseX, mouseY));
        const s = Math.min(1, (FOLLOW_SPEED + 0.5) / dist);
        invoke('move_pet', { dx: rdx * s, dy: rdy * s });
        return;
      }

      // AI roam: execute plan step with wobble
      const skipMod = speed > 3 ? 1 : 2;
      frameSkip = (frameSkip + 1) % skipMod;
      if (!aiEnabled || (skipMod > 1 && frameSkip)) return;

      // Plan expired → replan
      if (currentPlan.currentStep >= currentPlan.totalSteps) { smartBrain(); return; }
      currentPlan.currentStep++;

      if (currentPlan.isPause) {
        if (currentState !== 'idle') changeState('idle');
        return;
      }

      // Base direction + sine wobble for organic movement
      const bv = DIR_VEC[currentPlan.direction];
      if (!bv) return;
      const wobble = Math.sin(currentPlan.currentStep * 0.12) * 0.15;
      let vx = bv[0] + wobble * (-bv[1]);
      let vy = bv[1] + wobble * bv[0];
      const vm = Math.sqrt(vx * vx + vy * vy);
      vx = vx / vm * speed; vy = vy / vm * speed;
      currentVelocity.x = vx; currentVelocity.y = vy;

      if (wouldLeaveScreen(vx, vy)) {
        handleWallBounce(vx < 0, vx > 0, vy < 0, vy > 0);
        return;
      }
      updateSpriteDirection(vx, vy);
      invoke('move_pet', { dx: vx, dy: vy });
    }
    function tick() { updateMovement(); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);

    // ---- Drag ----
    let menuOpen = false;
    petEl.addEventListener('contextmenu', async e => {
      e.preventDefault();
      menuOpen = true;
      await invoke('show_context_menu');
      menuOpen = false;
    });
    petEl.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      isDragging = true; hasMoved = false; isFalling = false;
      dragStartScreenX = e.screenX; dragStartScreenY = e.screenY;
      // Capture actual physical window position as drag base
      dragBaseReady = false;
      invoke('get_window_physical_pos').then(p => {
        dragBaseX = p.x; dragBaseY = p.y;
        dragBaseReady = true;
      }).catch(() => {
        // Fallback to currentX/Y if invoke fails
        dragBaseX = currentX; dragBaseY = currentY;
        dragBaseReady = true;
      });
      changeState('drag');
    });
    document.addEventListener('mousemove', e => {
      if (!isDragging || !dragBaseReady) return;
      hasMoved = true;
      // screenX/Y are CSS pixels; multiply by devicePixelRatio for physical pixels
      const dpr = window.devicePixelRatio || 1;
      const physDx = (e.screenX - dragStartScreenX) * dpr;
      const physDy = (e.screenY - dragStartScreenY) * dpr;
      invoke('move_pet_absolute', { x: dragBaseX + physDx, y: dragBaseY + physDy });
    });
    document.addEventListener('mouseup', e => {
      if (!isDragging || e.button !== 0) return;
      isDragging = false;
      dragBaseReady = false;
      if (hasMoved) { isFalling = true; fallVelocity = 0; changeState('fall'); }
      else { changeState('idle'); }
    });

    // ---- Sprite ----
    // For non-standard spritesheets: { w, h } override raw size, { rowH } overrides
    // individual row heights (0=idle, 1=walk, 2=drag, 3=fall). Default: 4 equal rows.
    const SPRITE_ADJUST = { 'shiba': { bsH: 530 } };

    function applySprite(sprite) {
      const url = sprite.is_preset ? sprite.url : convertFileSrc(sprite.url);
      const adj = SPRITE_ADJUST[sprite.id] || {};
      const fw = sprite.w / 4;
      const scale = DISPLAY_SIZE / fw;
      const bsW = Math.round(sprite.w * scale);
      const bsH = adj.bsH || Math.round(sprite.h * scale);
      const fh = bsH / 4;
      frameH = Math.round(fh);

      petEl.style.width = DISPLAY_SIZE + 'px';
      petEl.style.height = DISPLAY_SIZE + 'px';
      petEl.style.backgroundImage = `url(${url})`;
      petEl.style.backgroundSize = `${bsW}px ${bsH}px`;
      // Store row offsets for changeState
      petEl._rowY = [0, -frameH, -2 * frameH, -3 * frameH];
      petEl.setAttribute('data-sprite', sprite.id);
      let styleEl = document.getElementById('dyn-keyframes');
      if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'dyn-keyframes'; document.head.appendChild(styleEl); }
      styleEl.textContent = `@keyframes sprite-x-anim { from { background-position-x: 0px; } to { background-position-x: -${bsW}px; } }`;
      const st = currentState; petEl.className = ''; void petEl.offsetWidth; changeState(st);
    }

    // Initialize position first, then settings, then start AI
    invoke('get_position').then(() => {
      // Wait a tick for window-position event to be processed
      return new Promise(resolve => setTimeout(resolve, 50));
    }).then(() => {
      // Sync currentX/Y from windowStartX/Y if still at origin
      if (currentX === 0 && currentY === 0 && (windowStartX !== 0 || windowStartY !== 0)) {
        currentX = windowStartX;
        currentY = windowStartY;
      }
      return invoke('get_settings');
    }).then(s => {
      aiEnabled = s.ai_enabled; followEnabled = s.follow_enabled;
      speed = BASE_SPEED * s.speed_multiplier;
      if (s.sprite) applySprite(s.sprite);
      if (aiEnabled && !followEnabled) scheduleBrain();
    });
  </script>
</body>
</html>
