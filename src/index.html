<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./pet.less">
</head>
<body>
  <div id="pet" class="pet-idle"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const petEl = document.getElementById('pet');
    const DISPLAY_SIZE = 128;
    let frameH = 128;

    let currentState = 'idle';
    let currentX = 0, currentY = 0;
    let displays = [{ x: 0, y: 0, w: 1920, h: 1032 }];
    let aiEnabled = true, followEnabled = false, chaseEnabled = false;
    let isDragging = false, hasMoved = false, isFalling = false;
    let fallVelocity = 0;
    let dragStartScreenX = 0, dragStartScreenY = 0;
    let dragBaseX = 0, dragBaseY = 0, dragBaseReady = false;
    let windowStartX = 0, windowStartY = 0;
    let speed = 1.5;
    const BASE_SPEED = 1.5;
    const CHASE_SPEED = BASE_SPEED * 3; // 逃逸模式固定3x速，不受移动速度倍率影响
    const GRAVITY = 0.8;
    const CHASE_RADIUS = 1000;
    const CHASE_BURST_DIST = 150;   // 触发瞬时加速的距离
    const CHASE_BURST_CHANCE = 0.15; // 每帧 15% 概率触发加速
    let chaseBurstFrames = 0;        // 剩余加速帧数
    let chaseBounceFrames = 0;       // 剩余弹射帧数（碰壁后）
    let chaseBounceDir = { x: 0, y: 0 }; // 弹射方向
    let chaseDodgeFrames = 0;        // 闪避帧数（近距离突然变相）
    let chaseDodgeDir = { x: 0, y: 0 }; // 闪避方向
    let chaseDodgeCooldown = 0;      // 闪避冷却帧数
    // 鼠标静止检测
    let lastMouseMoveTime = Date.now();
    let lastMouseX2 = -999, lastMouseY2 = -999;
    const MOUSE_IDLE_THRESHOLD = 1500; // 1.5秒不动视为静止 // 3秒不动视为静止
    let chasePanicFrames = 0;          // 鼠标突然移动后的恐慌逃跑帧数
    let chaseIdleHold = 0;             // 待命保持帧数（避免频繁切换）
    let chaseWalkHold = 0;             // 靠近行走保持帧数
    let chaseSettled = false;          // 已到达稳定距离，锁定待命
    let chaseLastDist = -1;            // 上次鼠标距离（用于检测距离稳定）

    // ---- Cursor poll (Rust provides global pos) ----
    let mouseX = -999, mouseY = -999;
    setInterval(async () => {
      try { const p = await invoke('get_cursor_pos'); mouseX = p.x; mouseY = p.y; } catch (_) {}
      checkMouseReaction();
    }, 50);

    // ---- Events ----
    listen('current-pos', (e) => {
      currentX = e.payload.currentX; currentY = e.payload.currentY;
      if (e.payload.displays) displays = e.payload.displays;
      // Safety net: if Rust had to clamp, angle-reflect bounce
      if (e.payload.blockedX || e.payload.blockedY) {
        handleWallBounce(
          e.payload.blockedX && currentVelocity.x < 0,
          e.payload.blockedX && currentVelocity.x > 0,
          e.payload.blockedY && currentVelocity.y < 0,
          e.payload.blockedY && currentVelocity.y > 0,
        );
      }
    });
    listen('window-position', (e) => {
      windowStartX = e.payload.x; windowStartY = e.payload.y;
      if (e.payload.displays) displays = e.payload.displays;
    });
    listen('settings-changed', (e) => {
      const s = e.payload;
      aiEnabled = s.ai_enabled; followEnabled = s.follow_enabled; chaseEnabled = s.chase_enabled;
      speed = BASE_SPEED * s.speed_multiplier;
      plannedSpeed = speed;
      // Apply new speed to current velocity immediately
      const vm = Math.sqrt(currentVelocity.x * currentVelocity.x + currentVelocity.y * currentVelocity.y);
      if (vm > 0.01) {
        currentVelocity.x = currentVelocity.x / vm * speed;
        currentVelocity.y = currentVelocity.y / vm * speed;
      }
      if (chaseEnabled) {
        // 追逐模式：AI brain 仍然运行（鼠标远离时回落到漫游）
        scheduleBrain();
      } else if (aiEnabled && !followEnabled) {
        scheduleBrain();
      } else if (!followEnabled) {
        if (brainTimer) { clearTimeout(brainTimer); brainTimer = null; }
        changeState('idle');
      }
      if (s.sprite) applySprite(s.sprite);
    });

    // ---- State rendering ----
    function changeState(newState) {
      currentState = newState;
      const isWalking = newState !== 'idle' && newState !== 'drag' && newState !== 'fall';
      if (isWalking) {
        const speedRatio = Math.min(speed / BASE_SPEED, 4);
        petEl.style.animationDuration = (0.6 / Math.sqrt(speedRatio)) + 's';
      } else {
        petEl.style.animationDuration = '';
      }

      const row = petEl._rowY || [0, -frameH, -2*frameH, -3*frameH];
      if (newState.includes('left')) { petEl.className = 'pet-walk-left'; petEl.style.backgroundPositionY = row[1] + 'px'; }
      else if (newState.includes('right')) { petEl.className = 'pet-walk-right'; petEl.style.backgroundPositionY = row[1] + 'px'; }
      else if (newState === 'walk-up' || newState === 'walk-down') { petEl.className = 'pet-walk-right'; petEl.style.backgroundPositionY = row[1] + 'px'; }
      else if (newState === 'drag') { petEl.className = 'pet-drag'; petEl.style.backgroundPositionY = row[2] + 'px'; }
      else if (newState === 'fall') { petEl.className = 'pet-fall'; petEl.style.backgroundPositionY = row[3] + 'px'; }
      else { petEl.className = 'pet-' + newState; petEl.style.backgroundPositionY = row[0] + 'px'; }
    }

    // ---- AI Brain 4.0 (step-based plan + wobble) ----
    const MARGIN = 200;
    const GAP = 50; // generous tolerance for DPI / monitor offset mismatches
    const WALK_DIRS = ['walk-left','walk-up-left','walk-up','walk-up-right',
                       'walk-right','walk-down-right','walk-down','walk-down-left'];
    const DIR_VEC = {
      'walk-left':[-1,0], 'walk-right':[1,0], 'walk-up':[0,-1], 'walk-down':[0,1],
      'walk-up-left':[-0.7071,-0.7071], 'walk-up-right':[0.7071,-0.7071],
      'walk-down-left':[-0.7071,0.7071], 'walk-down-right':[0.7071,0.7071]
    };

    let currentVelocity = { x: 0, y: 0 };
    let currentPlan = { direction: 'idle', totalSteps: 0, currentStep: 0, isPause: false };
    let lastDir = null;           // 上一步方向，用于惯性
    let plannedSpeed = speed;     // 当前计划的目标速度

    // ---- Time awareness: 深夜减速 + 频繁休息 ----
    function getTimeModifier() {
      const h = new Date().getHours();
      // 23~6 深夜: 慢速 + 多休息
      if (h >= 23 || h < 6) return { speedMul: 0.5, restBias: 0.6 };
      // 6~9 早晨: 逐渐活跃
      if (h < 9) return { speedMul: 0.8, restBias: 0.45 };
      // 9~18 白天: 正常
      return { speedMul: 1.0, restBias: 0.4 };
    }

    // ---- Hotspot memory: 记录停留过的喜欢位置 ----
    const hotspots = [];           // { x, y }[]
    const MAX_HOTSPOTS = 6;
    let idleStartX = -1, idleStartY = -1;
    function recordHotspot() {
      if (idleStartX < 0) return;
      const dx = currentX - idleStartX, dy = currentY - idleStartY;
      // 只记录停留超过一段时间的位置（距离变化不大说明待得久）
      if (dx * dx + dy * dy < MARGIN * MARGIN) {
        const dup = hotspots.some(h => Math.abs(h.x - currentX) < 100 && Math.abs(h.y - currentY) < 100);
        if (!dup) {
          hotspots.push({ x: currentX, y: currentY });
          if (hotspots.length > MAX_HOTSPOTS) hotspots.shift();
        }
      }
      idleStartX = -1;
    }

    // ---- Mouse reaction: 鼠标快速经过时好奇/躲避 ----
    let prevMouseX = -999, prevMouseY = -999;
    let mouseReaction = 0;        // 剩余反应帧数
    let mouseReactionDir = { x: 0, y: 0 };
    function checkMouseReaction() {
      if (isDragging || followEnabled || chaseEnabled || !aiEnabled) return;
      const mdx = mouseX - prevMouseX, mdy = mouseY - prevMouseY;
      const mSpeed = Math.sqrt(mdx * mdx + mdy * mdy);
      const pcx = currentX + DISPLAY_SIZE / 2, pcy = currentY + DISPLAY_SIZE / 2;
      const distToMouse = Math.sqrt((mouseX - pcx) ** 2 + (mouseY - pcy) ** 2);
      // 鼠标在 200px 内且速度较快时触发
      if (mSpeed > 20 && distToMouse < 200 && mouseReaction <= 0) {
        mouseReaction = 20 + Math.floor(Math.random() * 20);
        // 80% 概率好奇看向鼠标，20% 概率躲避
        if (Math.random() < 0.8) {
          const angle = Math.atan2(mouseY - pcy, mouseX - pcx);
          mouseReactionDir = { x: Math.cos(angle) * 0.5, y: Math.sin(angle) * 0.5 };
        } else {
          const angle = Math.atan2(pcy - mouseY, pcx - mouseX);
          mouseReactionDir = { x: Math.cos(angle) * 1.5, y: Math.sin(angle) * 1.5 };
        }
      }
      prevMouseX = mouseX; prevMouseY = mouseY;
    }

    function dirToAngle(dir) {
      switch (dir) {
        case 'walk-left': return Math.PI;
        case 'walk-up-left': return Math.PI * 0.75;
        case 'walk-up': return Math.PI * 0.5;
        case 'walk-up-right': return Math.PI * 0.25;
        case 'walk-right': return 0;
        case 'walk-down-right': return -Math.PI * 0.25;
        case 'walk-down': return -Math.PI * 0.5;
        case 'walk-down-left': return -Math.PI * 0.75;
        default: return 0;
      }
    }

    function reflectDir(dir, bl, br, bu, bd) {
      const rx = { 'walk-left':'walk-right','walk-right':'walk-left',
        'walk-up-left':'walk-up-right','walk-up-right':'walk-up-left',
        'walk-down-left':'walk-down-right','walk-down-right':'walk-down-left' };
      const ry = { 'walk-up':'walk-down','walk-down':'walk-up',
        'walk-up-left':'walk-down-left','walk-up-right':'walk-down-right',
        'walk-down-left':'walk-up-left','walk-down-right':'walk-up-right' };
      if (bl || br) dir = rx[dir] || dir;
      if (bu || bd) dir = ry[dir] || dir;
      return dir;
    }

    let lastSpriteChange = 0;
    function updateSpriteDirection(vx, vy) {
      if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) {
        if (currentState !== 'idle') changeState('idle');
        return;
      }
      const now = Date.now();
      if (now - lastSpriteChange < 150) return;
      const deg = Math.atan2(vy, vx) * 180 / Math.PI;
      let state;
      if (deg > 157.5 || deg <= -157.5) state = 'walk-left';
      else if (deg > 112.5) state = 'walk-up-left';
      else if (deg > 67.5) state = 'walk-up';
      else if (deg > 22.5) state = 'walk-up-right';
      else if (deg > -22.5) state = 'walk-right';
      else if (deg > -67.5) state = 'walk-down-right';
      else if (deg > -112.5) state = 'walk-down';
      else state = 'walk-down-left';
      if (currentState !== state) { changeState(state); lastSpriteChange = now; }
    }

    // ---- Multi-display helpers ----
    function edgeIsSeam(display, side) {
      for (const other of displays) {
        if (other === display) continue;
        const yOverlap = display.y < other.y + other.h && display.y + display.h > other.y;
        const xOverlap = display.x < other.x + other.w && display.x + display.w > other.x;
        switch (side) {
          case 'left':   if (Math.abs(other.x + other.w - display.x) <= GAP && yOverlap) return true; break;
          case 'right':  if (Math.abs(other.x - (display.x + display.w)) <= GAP && yOverlap) return true; break;
          case 'top':    if (Math.abs(other.y + other.h - display.y) <= GAP && xOverlap) return true; break;
          case 'bottom': if (Math.abs(other.y - (display.y + display.h)) <= GAP && xOverlap) return true; break;
        }
      }
      return false;
    }

    function effectiveEdgeDist(cx, cy) {
      let dl = Infinity, dr = Infinity, du = Infinity, dd = Infinity;
      for (const d of displays) {
        if (cx >= d.x - 2 && cx < d.x + d.w + 2 && cy >= d.y - 2 && cy < d.y + d.h + 2) {
          if (!edgeIsSeam(d, 'left'))   dl = Math.min(dl, cx - d.x);
          if (!edgeIsSeam(d, 'right'))  dr = Math.min(dr, d.x + d.w - cx);
          if (!edgeIsSeam(d, 'top'))    du = Math.min(du, cy - d.y);
          if (!edgeIsSeam(d, 'bottom')) dd = Math.min(dd, d.y + d.h - cy);
        }
      }
      return { dl, dr, du, dd };
    }

    function desktopCenter() {
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const d of displays) {
        if (d.x < x1) x1 = d.x; if (d.y < y1) y1 = d.y;
        if (d.x + d.w > x2) x2 = d.x + d.w; if (d.y + d.h > y2) y2 = d.y + d.h;
      }
      return { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
    }

    // 获取宠物当前所在显示器的中心
    function currentDisplayCenter(cx, cy) {
      for (const d of displays) {
        if (cx >= d.x && cx < d.x + d.w && cy >= d.y && cy < d.y + d.h) {
          return { x: d.x + d.w / 2, y: d.y + d.h / 2 };
        }
      }
      return desktopCenter(); // fallback
    }

    // 获取宠物所在显示器的有效安全区域（远离边缘）
    function getComfortZone(cx, cy) {
      for (const d of displays) {
        if (cx >= d.x && cx < d.x + d.w && cy >= d.y && cy < d.y + d.h) {
          const inset = Math.min(d.w, d.h) * 0.25; // 内缩25%作为舒适区
          return {
            left: d.x + inset,
            right: d.x + d.w - inset,
            top: d.y + inset,
            bottom: d.y + d.h - inset,
            centerX: d.x + d.w / 2,
            centerY: d.y + d.h / 2
          };
        }
      }
      return null;
    }

    // ---- Plan-based brain ----
    function smartBrain() {
      if (isDragging || isFalling || !aiEnabled || followEnabled) return;
      const tm = getTimeModifier();

      const cx = currentX + DISPLAY_SIZE / 2, cy = currentY + DISPLAY_SIZE / 2;
      const e = effectiveEdgeDist(cx, cy);
      const minEdge = Math.min(e.dl, e.dr, e.du, e.dd);
      const nearEdge = minEdge < MARGIN;

      // Walk-rest rhythm: time-modulated rest bias; never rest twice in a row
      const wasPaused = currentPlan.isPause;
      if (wasPaused) recordHotspot();
      if (!nearEdge && !wasPaused && Math.random() < tm.restBias) {
        currentPlan.direction = 'idle';
        currentPlan.totalSteps = 45 + Math.floor(Math.random() * 90); // 1.5~3s
        currentPlan.isPause = true;
        currentPlan.currentStep = 0;
        idleStartX = currentX; idleStartY = currentY;
        currentVelocity.x = 0; currentVelocity.y = 0;
        changeState('idle');
        scheduleBrain();
        return;
      }

      // Walk in a discrete 8-direction
      currentPlan.isPause = false;
      currentPlan.totalSteps = 60 + Math.floor(Math.random() * 120); // 2~4.5s
      currentPlan.currentStep = 0;

      // Hotspot memory: 25% chance to walk toward a remembered spot
      let targetX, targetY, hasHotspotTarget = false;
      if (hotspots.length > 0 && Math.random() < 0.25) {
        const spot = hotspots[Math.floor(Math.random() * hotspots.length)];
        targetX = spot.x + DISPLAY_SIZE / 2;
        targetY = spot.y + DISPLAY_SIZE / 2;
        hasHotspotTarget = true;
      }

      // Center direction (fallback when no hotspot target)
      const dc = hasHotspotTarget ? { x: targetX, y: targetY } : currentDisplayCenter(cx, cy);
      const toCX = dc.x - cx, toCY = dc.y - cy;
      const distToCenter = Math.sqrt(toCX * toCX + toCY * toCY);
      const dirCX = distToCenter > 1 ? toCX / distToCenter : 0;
      const dirCY = distToCenter > 1 ? toCY / distToCenter : 0;

      // 舒适区检测：在显示器边缘附近时加强中心吸引力
      const comfortZone = getComfortZone(cx, cy);
      let inComfortZone = true;
      if (comfortZone) {
        inComfortZone = cx >= comfortZone.left && cx <= comfortZone.right &&
                       cy >= comfortZone.top && cy <= comfortZone.bottom;
      }

      // 中心吸引力：在舒适区内较弱，靠近边缘时逐渐增强
      const edgeProximity = 1.0 - Math.min(1, minEdge / MARGIN);
      const centerStrength = hasHotspotTarget ? 0.5 : (
        inComfortZone ? 0.15 : 0.15 + edgeProximity * 0.7
      );

      // 边缘惩罚：越靠近边缘，向该方向移动的权重越低
      const edgePenalty = (d) => {
        if (d >= MARGIN) return 1.0; // 远离边缘，无惩罚
        if (d < 50) return 0.1;      // 非常近，强烈惩罚
        return Math.max(0.1, Math.pow(d / MARGIN, 1.5)); // 平滑过渡
      };

      const weights = WALK_DIRS.map(dir => {
        let w = 1.0;
        const v = DIR_VEC[dir];

        // 边缘避让：向边缘方向移动时权重降低
        if (v[0] < 0) w *= edgePenalty(e.dl); // 向左
        if (v[0] > 0) w *= edgePenalty(e.dr); // 向右
        if (v[1] < 0) w *= edgePenalty(e.du); // 向上
        if (v[1] > 0) w *= edgePenalty(e.dd); // 向下
        const dot = v[0] * dirCX + v[1] * dirCY;
        w *= 1.0 + Math.tanh(dot * 2) * centerStrength;
        // Slight anti-diagonal bias
        if (v[0] !== 0 && v[1] !== 0) w *= 0.85;
        // 方向惯性：延续上次方向权重更高
        if (lastDir === dir) w *= 1.8;
        // 相邻方向也有一定延续性
        if (lastDir) {
          const lastV = DIR_VEC[lastDir];
          if (lastV) {
            const similarity = v[0] * lastV[0] + v[1] * lastV[1];
            if (similarity > 0) w *= 1.0 + similarity * 0.3;
          }
        }
        w *= 0.6 + Math.random() * 0.8;
        return w;
      });

      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < WALK_DIRS.length; i++) {
        r -= weights[i];
        if (r <= 0) { currentPlan.direction = WALK_DIRS[i]; break; }
      }
      if (!currentPlan.direction) currentPlan.direction = WALK_DIRS[0];
      lastDir = currentPlan.direction;
      // 计划速度：时间调制 + 随机波动
      plannedSpeed = speed * tm.speedMul * (0.8 + Math.random() * 0.4);
      scheduleBrain();
    }

    let brainTimer = null;
    function scheduleBrain() {
      if (brainTimer) clearTimeout(brainTimer);
      const delay = 1500 + Math.random() * 1500;
      brainTimer = setTimeout(() => { smartBrain(); scheduleBrain(); }, delay);
    }
    scheduleBrain();

    // Wall bounce: safety net — break plan, reflect discrete direction
    function handleWallBounce(blockedLeft, blockedRight, blockedUp, blockedDown) {
      if (isDragging) return;
      if (isFalling) { isFalling = false; changeState('idle'); return; }
      currentPlan.direction = reflectDir(currentPlan.direction,
        blockedLeft, blockedRight, blockedUp, blockedDown);
      lastDir = currentPlan.direction;
      plannedSpeed = speed;
      const angle = dirToAngle(currentPlan.direction) + (Math.random() - 0.5) * 0.5;
      currentVelocity.x = Math.cos(angle) * speed;
      currentVelocity.y = Math.sin(angle) * speed;
      currentPlan.totalSteps = 30 + Math.floor(Math.random() * 30);
      currentPlan.currentStep = 0;
      currentPlan.isPause = false;
    }

    function wouldLeaveScreen(dx, dy) {
      const nx = currentX + dx, ny = currentY + dy;
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const d of displays) {
        if (d.x < x1) x1 = d.x; if (d.y < y1) y1 = d.y;
        if (d.x + d.w > x2) x2 = d.x + d.w; if (d.y + d.h > y2) y2 = d.y + d.h;
      }
      if (dx < 0 && nx < x1) return true;
      if (dx > 0 && nx + DISPLAY_SIZE > x2) return true;
      if (dy < 0 && ny < y1) return true;
      if (dy > 0 && ny + DISPLAY_SIZE > y2) return true;
      const cx = nx + DISPLAY_SIZE / 2, cy = ny + DISPLAY_SIZE / 2;
      for (const d of displays) {
        if (cx >= d.x - 2 && cx < d.x + d.w + 2 && cy >= d.y - 2 && cy < d.y + d.h + 2) return false;
      }
      return true;
    }

    function pickFollowDir(px, py, mx, my) {
      const dx = mx - px - DISPLAY_SIZE / 2, dy = my - py - DISPLAY_SIZE / 2;
      const deg = Math.atan2(dy, dx) * 180 / Math.PI;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return 'idle';
      if (deg > 157.5 || deg <= -157.5) return 'walk-left';
      if (deg > 112.5) return 'walk-up-left';
      if (deg > 67.5) return 'walk-up';
      if (deg > 22.5) return 'walk-up-right';
      if (deg > -22.5) return 'walk-right';
      if (deg > -67.5) return 'walk-down-right';
      if (deg > -112.5) return 'walk-down';
      return 'walk-down-left';
    }

    let frameSkip = 0;
    function updateMovement() {
      if (isDragging || menuOpen) return;

      // Falling & following: every frame for smoothness
      if (isFalling) { fallVelocity += GRAVITY; invoke('move_pet', { dx: 0, dy: fallVelocity }); return; }
      if (followEnabled && mouseX !== -999) {
        const tx = mouseX - DISPLAY_SIZE / 2, ty = mouseY - DISPLAY_SIZE / 2;
        const rdx = tx - currentX, rdy = ty - currentY;
        const dist = Math.sqrt(rdx * rdx + rdy * rdy);
        if (dist < 8) { changeState('idle'); return; }
        changeState(pickFollowDir(currentX, currentY, mouseX, mouseY));
        const s = Math.min(1, (speed + 0.5) / dist);
        invoke('move_pet', { dx: rdx * s, dy: rdy * s });
        return;
      }

      // Chase mode: AI-driven flee from mouse cursor (no radius limit)
      if (chaseEnabled && mouseX !== -999) {
        const pcx = currentX + DISPLAY_SIZE / 2, pcy = currentY + DISPLAY_SIZE / 2;
        const rdx = pcx - mouseX, rdy = pcy - mouseY;
        const dist = Math.sqrt(rdx * rdx + rdy * rdy);
        const e = effectiveEdgeDist(pcx, pcy);

        // 鼠标静止检测
        const mdx2 = mouseX - lastMouseX2, mdy2 = mouseY - lastMouseY2;
        const mouseMoved = Math.sqrt(mdx2 * mdx2 + mdy2 * mdy2) > 3;
        if (mouseMoved) {
          lastMouseMoveTime = Date.now();
          lastMouseX2 = mouseX; lastMouseY2 = mouseY;
          chaseIdleHold = 0; // 鼠标动了，立刻打破待命保持
          chaseWalkHold = 0;
          chaseSettled = false; // 鼠标动了，打破稳定状态
          if (chasePanicFrames <= 0) {
            chasePanicFrames = 30 + Math.floor(Math.random() * 30);
            chaseBurstFrames = 15;
          }
        }
        const mouseIdle = Date.now() - lastMouseMoveTime > MOUSE_IDLE_THRESHOLD;

        // 弹射状态：碰壁后锁定方向飞行，忽略鼠标（可穿透鼠标）
        if (chaseBounceFrames > 0) {
          chaseBounceFrames--;
          const bx = chaseBounceDir.x, by = chaseBounceDir.y;
          updateSpriteDirection(bx, by);
          if (wouldLeaveScreen(bx, by)) {
            let nx = bx, ny = by;
            if (wouldLeaveScreen(nx, 0)) nx = -nx;
            if (wouldLeaveScreen(0, ny)) ny = -ny;
            if (wouldLeaveScreen(nx, ny)) {
              // 角落：朝中心方向弹射，加随机偏移
              const dc = desktopCenter();
              const toCX = dc.x - pcx, toCY = dc.y - pcy;
              const mag = Math.sqrt(toCX * toCX + toCY * toCY);
              if (mag > 1) {
                const ang = (Math.random() - 0.5) * Math.PI * 0.6; // ±54°
                const cos = Math.cos(ang), sin = Math.sin(ang);
                const cx = toCX / mag, cy = toCY / mag;
                nx = (cx * cos - cy * sin) * CHASE_SPEED * (1.5 + Math.random());
                ny = (cx * sin + cy * cos) * CHASE_SPEED * (1.5 + Math.random());
              }
            }
            chaseBounceDir = { x: nx, y: ny };
          }
          // 高频随机扰动，让轨迹不可预测
          if (Math.random() < 0.4) {
            const jitter = (Math.random() - 0.5) * Math.PI * 0.4; // ±36°
            const cos = Math.cos(jitter), sin = Math.sin(jitter);
            const jx = chaseBounceDir.x * cos - chaseBounceDir.y * sin;
            const jy = chaseBounceDir.x * sin + chaseBounceDir.y * cos;
            chaseBounceDir = { x: jx, y: jy };
          }
          // 弹射时如果鼠标在前方，额外加偏转避开
          if (dist < 200 && mouseX !== -999) {
            const toMouseX = mouseX - pcx, toMouseY = mouseY - pcy;
            const mouseDot = (chaseBounceDir.x * toMouseX + chaseBounceDir.y * toMouseY);
            if (mouseDot > 0) { // 正在朝鼠标方向飞
              const deflect = (Math.random() > 0.5 ? 1 : -1) * Math.PI * 0.3; // ±54°
              const cos = Math.cos(deflect), sin = Math.sin(deflect);
              const dx = chaseBounceDir.x * cos - chaseBounceDir.y * sin;
              const dy = chaseBounceDir.x * sin + chaseBounceDir.y * cos;
              chaseBounceDir = { x: dx, y: dy };
            }
          }
          invoke('move_pet', { dx: chaseBounceDir.x, dy: chaseBounceDir.y });
          // 弹射结束时触发panic，确保立刻进入高机动逃跑
          if (chaseBounceFrames <= 0) {
            chasePanicFrames = Math.max(chasePanicFrames, 20 + Math.floor(Math.random() * 20));
            chaseBurstFrames = Math.max(chaseBurstFrames, 10);
          }
          return;
        }

        // 近距离闪避：鼠标几乎重叠时概率触发高机动变相逃逸
        if (chaseDodgeFrames > 0) {
          chaseDodgeFrames--;
          // 每帧小幅随机偏转，模拟不可预测的闪避轨迹
          if (Math.random() < 0.3) {
            const jitter = (Math.random() - 0.5) * 0.5; // ±14°
            const cos = Math.cos(jitter), sin = Math.sin(jitter);
            const dx = chaseDodgeDir.x * cos - chaseDodgeDir.y * sin;
            const dy = chaseDodgeDir.x * sin + chaseDodgeDir.y * cos;
            chaseDodgeDir = { x: dx, y: dy };
          }
          updateSpriteDirection(chaseDodgeDir.x, chaseDodgeDir.y);
          invoke('move_pet', { dx: chaseDodgeDir.x, dy: chaseDodgeDir.y });
          if (chaseDodgeFrames <= 0) {
            chaseDodgeCooldown = 60 + Math.floor(Math.random() * 30); // 冷却 60-90 帧
            chasePanicFrames = Math.max(chasePanicFrames, 25);
            chaseBurstFrames = Math.max(chaseBurstFrames, 12);
          }
          return;
        }
        if (chaseDodgeCooldown > 0) chaseDodgeCooldown--;

        // 触发闪避：距离 < 80px 且鼠标在动且不在冷却，40% 概率触发
        if (!mouseIdle && dist < 80 && chaseDodgeCooldown <= 0 && Math.random() < 0.4) {
          // 计算垂直于鼠标方向的闪避（类似避障的侧向急转）
          const mouseAngle = Math.atan2(rdy, rdx); // 鼠标到宠物的方向
          const perpAngle = mouseAngle + (Math.random() > 0.5 ? 1 : -1) * Math.PI / 2; // 垂直方向 ±90°
          const dodgeAngle = perpAngle + (Math.random() - 0.5) * 0.6; // 加随机偏移 ±17°
          const dodgeSpd = CHASE_SPEED * (3.0 + Math.random()); // 3-4 倍速
          chaseDodgeDir = {
            x: Math.cos(dodgeAngle) * dodgeSpd,
            y: Math.sin(dodgeAngle) * dodgeSpd
          };
          chaseDodgeFrames = 10 + Math.floor(Math.random() * 8); // 10-18 帧
          updateSpriteDirection(chaseDodgeDir.x, chaseDodgeDir.y);
          invoke('move_pet', { dx: chaseDodgeDir.x, dy: chaseDodgeDir.y });
          return;
        }

        // 鼠标静止 → 根据距离平滑过渡：远→靠近，近→待命
        if (mouseIdle) {
          // 距离越近，待命概率越高；速度也随距离降低
          const idleProb = dist < 50 ? 0.7
            : dist < 150 ? 0.1 + 0.6 * (150 - dist) / 100
            : 0.03;
          const approachFactor = Math.min(0.7, Math.max(0.1, (dist - 40) / 400));

          // 稳定状态：距离足够近且变化不大时，锁定待命
          if (chaseSettled) {
            if (currentState !== 'idle') changeState('idle');
            // 检测距离是否还稳定（变化 < 30px 继续保持）
            if (chaseLastDist >= 0 && Math.abs(dist - chaseLastDist) < 30) {
              chaseLastDist = dist;
              return;
            }
            chaseSettled = false; // 距离变化太大，退出稳定状态
          }
          chaseLastDist = dist;

          // 保持计数器：避免每帧都重新判断
          if (chaseIdleHold > 0) {
            chaseIdleHold--;
            if (currentState !== 'idle') changeState('idle');
            return;
          }
          if (chaseWalkHold > 0) {
            chaseWalkHold--;
            // 继续上一轮的行走方向（重新走一步）
            // fall through to walk logic below
          }

          // 重新做决策
          if (Math.random() < idleProb) {
            // 决定待命：保持 5~15 帧（约 0.08~0.25 秒），非常短促
            chaseIdleHold = 5 + Math.floor(Math.random() * 10);
            // 如果距离足够近，进入稳定待命状态
            if (dist < 120) {
              chaseSettled = true;
            }
            if (currentState !== 'idle') changeState('idle');
            return;
          }

          // 决定行走：保持 8~120 帧，短长步随机交替
          chaseWalkHold = 8 + Math.floor(Math.random() * Math.random() * 112);

          // 慢慢靠近鼠标
          const toMouseX = mouseX - pcx, toMouseY = mouseY - pcy;
          const mouseDist = Math.sqrt(toMouseX * toMouseX + toMouseY * toMouseY);
          const mouseDirX = mouseDist > 1 ? toMouseX / mouseDist : 0;
          const mouseDirY = mouseDist > 1 ? toMouseY / mouseDist : 0;
          const soft = d => d >= MARGIN ? 1.0 : Math.max(Math.sqrt(d / MARGIN), 0.02);
          const weights = WALK_DIRS.map(dir => {
            let w = 1.0;
            const v = DIR_VEC[dir];
            if (dir.includes('left'))  w *= soft(e.dl);
            if (dir.includes('right')) w *= soft(e.dr);
            if (dir.includes('up'))    w *= soft(e.du);
            if (dir.includes('down'))  w *= soft(e.dd);
            const mouseDot = v[0] * mouseDirX + v[1] * mouseDirY;
            w *= 1.0 + Math.tanh(mouseDot * 2) * 2.0;
            if (v[0] !== 0 && v[1] !== 0) w *= 0.85;
            w *= 0.8 + Math.random() * 0.4;
            return w;
          });
          const total = weights.reduce((a, b) => a + b, 0);
          let r = Math.random() * total;
          let chosenDir = WALK_DIRS[0];
          for (let i = 0; i < WALK_DIRS.length; i++) {
            r -= weights[i];
            if (r <= 0) { chosenDir = WALK_DIRS[i]; break; }
          }
          const bv = DIR_VEC[chosenDir];
          const spd = CHASE_SPEED * approachFactor;
          let vx = bv[0] * spd, vy = bv[1] * spd;
          const wobble = Math.sin(Date.now() * 0.006) * 0.08;
          vx += wobble * (-bv[1]); vy += wobble * bv[0];
          updateSpriteDirection(vx, vy);
          invoke('move_pet', { dx: vx, dy: vy });
          return;
        }

        // 鼠标活动 → 逃跑（无距离限制）
        const minEdge = Math.min(e.dl, e.dr, e.du, e.dd);
        const nearEdge = minEdge < MARGIN;
        const edgeThreshold = MARGIN * 1.2; // 提前检测角落
        const nearL = e.dl < edgeThreshold, nearR = e.dr < edgeThreshold;
        const nearU = e.du < edgeThreshold, nearD = e.dd < edgeThreshold;
        const inCorner = (nearL || nearR) && (nearU || nearD);

        // 角落紧急逃逸：当在角落且鼠标靠近时，强制朝中心爆发
        if (inCorner && dist < 500) {
          const dc = desktopCenter();
          const toCX = dc.x - pcx, toCY = dc.y - pcy;
          const mag = Math.sqrt(toCX * toCX + toCY * toCY);
          if (mag > 1) {
            // 加随机偏移避免直线
            const ang = (Math.random() - 0.5) * Math.PI * 0.5;
            const cos = Math.cos(ang), sin = Math.sin(ang);
            const cx = toCX / mag, cy = toCY / mag;
            const burstSpd = CHASE_SPEED * (2.0 + Math.random());
            chaseBounceDir = {
              x: (cx * cos - cy * sin) * burstSpd,
              y: (cx * sin + cy * cos) * burstSpd
            };
            chaseBounceFrames = 8 + Math.floor(Math.random() * 8);
            chasePanicFrames = Math.max(chasePanicFrames, 30);
            updateSpriteDirection(chaseBounceDir.x, chaseBounceDir.y);
            invoke('move_pet', { dx: chaseBounceDir.x, dy: chaseBounceDir.y });
            return;
          }
        }

        const mouseDirX = dist > 1 ? rdx / dist : 0;
        const mouseDirY = dist > 1 ? rdy / dist : 0;
        const urgency = Math.min(1, Math.max(0, (800 - dist) / 800));
        // 逃跑力度：基础 2.0 + urgency 加成，panic 时翻倍
        let mouseStrength = 2.0 + urgency * 3.0;
        if (chasePanicFrames > 0) {
          chasePanicFrames--;
          mouseStrength *= 2.0;
        }
        const dc = desktopCenter();
        const toCX = dc.x - pcx, toCY = dc.y - pcy;
        const distToCenter = Math.sqrt(toCX * toCX + toCY * toCY);
        const dirCX = distToCenter > 1 ? toCX / distToCenter : 0;
        const dirCY = distToCenter > 1 ? toCY / distToCenter : 0;
        // 中心吸引力：靠近边缘时大幅增强，防止被逼入角落
        const centerStrength = nearEdge
          ? Math.pow(1.0 - minEdge / MARGIN, 2) * 2.0 + 0.5
          : 0.15;
        // 边缘避让随鼠标紧迫度增强：鼠标越近，越不敢靠边
        const edgeUrgency = 1.0 + urgency * 2.0; // 1.0~3.0x
        const soft = d => d >= MARGIN ? 1.0 : Math.max(0.5, Math.pow(d / MARGIN, 0.6)) ** edgeUrgency;
        const weights = WALK_DIRS.map(dir => {
          let w = 1.0;
          const v = DIR_VEC[dir];
          if (dir.includes('left'))  w *= soft(e.dl);
          if (dir.includes('right')) w *= soft(e.dr);
          if (dir.includes('up'))    w *= soft(e.du);
          if (dir.includes('down'))  w *= soft(e.dd);
          // 角落检测：仅限制进入角落的方向，不完全封死
          if (inCorner) {
            if (nearL && dir.includes('left'))  w *= 0.3;
            if (nearR && dir.includes('right')) w *= 0.3;
            if (nearU && dir.includes('up'))    w *= 0.3;
            if (nearD && dir.includes('down'))  w *= 0.3;
          }
          const mouseDot = v[0] * mouseDirX + v[1] * mouseDirY;
          w *= 1.0 + Math.tanh(mouseDot * 2) * mouseStrength;
          const centerDot = v[0] * dirCX + v[1] * dirCY;
          w *= 1.0 + Math.tanh(centerDot * 2) * centerStrength;
          if (v[0] !== 0 && v[1] !== 0) w *= 0.85;
          w *= 0.7 + Math.random() * 0.6;
          return w;
        });
        const total = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        let chosenDir = WALK_DIRS[0];
        for (let i = 0; i < WALK_DIRS.length; i++) {
          r -= weights[i];
          if (r <= 0) { chosenDir = WALK_DIRS[i]; break; }
        }
        const bv = DIR_VEC[chosenDir];
        // 更容易触发爆发：距离 < 300px 且 25% 概率，或 panic > 20
        if ((dist < CHASE_BURST_DIST * 2 && chaseBurstFrames <= 0 && Math.random() < 0.25) || chasePanicFrames > 20) {
          chaseBurstFrames = 10 + Math.floor(Math.random() * 10);
        }
        // 基础逃跑速度：1.0 + urgency * 0.8（最高 1.8 倍速）
        let spdMul = 1.0 + urgency * 0.8;
        if (chaseBurstFrames > 0) {
          chaseBurstFrames--;
          spdMul = 2.5;
        }
        const spd = CHASE_SPEED * spdMul;
        let vx = bv[0] * spd, vy = bv[1] * spd;
        const wobble = Math.sin(Date.now() * 0.008) * 0.1;
        vx += wobble * (-bv[1]); vy += wobble * bv[0];
        if (wouldLeaveScreen(vx, vy)) {
          let nx = vx, ny = vy;
          if (wouldLeaveScreen(nx, 0)) nx = -nx;
          if (wouldLeaveScreen(0, ny)) ny = -ny;
          if (wouldLeaveScreen(nx, ny)) {
            const toCX2 = dc.x - pcx, toCY2 = dc.y - pcy;
            const mag = Math.sqrt(toCX2 * toCX2 + toCY2 * toCY2);
            if (mag > 1) {
              nx = toCX2 / mag * CHASE_SPEED * 2.0;
              ny = toCY2 / mag * CHASE_SPEED * 2.0;
            }
          }
          // 随机化反弹方向和速度，让轨迹不可预测
          const bounceAng = (Math.random() - 0.5) * Math.PI * 0.5; // ±45°
          const cos = Math.cos(bounceAng), sin = Math.sin(bounceAng);
          const rnx = nx * cos - ny * sin;
          const rny = nx * sin + ny * cos;
          const bounceSpd = CHASE_SPEED * (1.5 + Math.random() * 1.0); // 1.5x~2.5x
          const bMag = Math.sqrt(rnx * rnx + rny * rny);
          if (bMag > 0.01) {
            chaseBounceDir = { x: rnx / bMag * bounceSpd, y: rny / bMag * bounceSpd };
            chaseBounceFrames = 8 + Math.floor(Math.random() * 12); // 8~20帧，缩短弹射时间
            updateSpriteDirection(chaseBounceDir.x, chaseBounceDir.y);
            invoke('move_pet', { dx: chaseBounceDir.x, dy: chaseBounceDir.y });
            return;
          }
        }
        updateSpriteDirection(vx, vy);
        invoke('move_pet', { dx: vx, dy: vy });
        return;
      }


      // AI roam: execute plan step with wobble
      const skipMod = speed > 3 ? 1 : 2;
      frameSkip = (frameSkip + 1) % skipMod;
      if (!aiEnabled || (skipMod > 1 && frameSkip)) return;

      // Mouse reaction: 好奇/躲避反应覆盖普通行走
      if (mouseReaction > 0) {
        mouseReaction--;
        const rx = mouseReactionDir.x, ry = mouseReactionDir.y;
        // 面朝反应方向
        updateSpriteDirection(rx, ry);
        // 只有躲避（速度 > 1）才实际移动
        if (Math.abs(rx) > 1 || Math.abs(ry) > 1) {
          invoke('move_pet', { dx: rx, dy: ry });
        }
        return;
      }

      // Plan expired → replan
      if (currentPlan.currentStep >= currentPlan.totalSteps) { smartBrain(); return; }
      currentPlan.currentStep++;

      if (currentPlan.isPause) {
        if (currentState !== 'idle') changeState('idle');
        // Idle 微动：身体轻微左右摇晃
        const sway = Math.sin(currentPlan.currentStep * 0.05) * 0.3;
        if (Math.abs(sway) > 0.15) {
          invoke('move_pet', { dx: sway, dy: 0 });
        }
        return;
      }

      // Base direction + composite sine wobble for organic movement
      const bv = DIR_VEC[currentPlan.direction];
      if (!bv) return;
      // 复合摆动：两个不同频率叠加，避免周期性机械感
      const wobble = Math.sin(currentPlan.currentStep * 0.1) * 0.12
                   + Math.sin(currentPlan.currentStep * 0.23 + 1.5) * 0.08;
      let vx = bv[0] + wobble * (-bv[1]);
      let vy = bv[1] + wobble * bv[0];

      // 加减速阶段：启动加速 → 匀速 → 停止减速
      const progress = currentPlan.currentStep / currentPlan.totalSteps;
      let spdFactor;
      if (progress < 0.15) spdFactor = progress / 0.15;
      else if (progress > 0.85) spdFactor = (1.0 - progress) / 0.15;
      else spdFactor = 1.0;
      const currentSpeed = plannedSpeed * Math.max(spdFactor, 0.1);

      // 渐变边缘转向（替代硬碰撞）
      const nx = currentX + vx, ny = currentY + vy;
      const ncx = nx + DISPLAY_SIZE / 2, ncy = ny + DISPLAY_SIZE / 2;
      let steerX = 0, steerY = 0;
      for (const d of displays) {
        if (ncx < d.x - 2 || ncx >= d.x + d.w + 2 || ncy < d.y - 2 || ncy >= d.y + d.h + 2) continue;
        const dl = ncx - d.x, dr = d.x + d.w - ncx;
        const du = ncy - d.y, dd = d.y + d.h - ncy;
        if (dl < MARGIN && !edgeIsSeam(d, 'left'))
          steerX += Math.pow(1.0 - dl / MARGIN, 2) * 2.0;
        if (dr < MARGIN && !edgeIsSeam(d, 'right'))
          steerX -= Math.pow(1.0 - dr / MARGIN, 2) * 2.0;
        if (du < MARGIN && !edgeIsSeam(d, 'top'))
          steerY += Math.pow(1.0 - du / MARGIN, 2) * 2.0;
        if (dd < MARGIN && !edgeIsSeam(d, 'bottom'))
          steerY -= Math.pow(1.0 - dd / MARGIN, 2) * 2.0;
      }
      vx += steerX; vy += steerY;

      const vm = Math.sqrt(vx * vx + vy * vy);
      if (vm > 0.01) { vx = vx / vm * currentSpeed; vy = vy / vm * currentSpeed; }
      currentVelocity.x = vx; currentVelocity.y = vy;

      if (wouldLeaveScreen(vx, vy)) {
        handleWallBounce(vx < 0, vx > 0, vy < 0, vy > 0);
        return;
      }
      updateSpriteDirection(vx, vy);
      invoke('move_pet', { dx: vx, dy: vy });
    }
    function tick() { updateMovement(); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);

    // ---- Drag ----
    let menuOpen = false;
    petEl.addEventListener('contextmenu', async e => {
      e.preventDefault();
      menuOpen = true;
      await invoke('show_context_menu');
      menuOpen = false;
    });
    petEl.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      isDragging = true; hasMoved = false; isFalling = false;
      dragStartScreenX = e.screenX; dragStartScreenY = e.screenY;
      // Capture actual physical window position as drag base
      dragBaseReady = false;
      invoke('get_window_physical_pos').then(p => {
        dragBaseX = p.x; dragBaseY = p.y;
        dragBaseReady = true;
      }).catch(() => {
        // Fallback to currentX/Y if invoke fails
        dragBaseX = currentX; dragBaseY = currentY;
        dragBaseReady = true;
      });
      changeState('drag');
    });
    document.addEventListener('mousemove', e => {
      if (!isDragging || !dragBaseReady) return;
      hasMoved = true;
      // screenX/Y are CSS pixels; multiply by devicePixelRatio for physical pixels
      const dpr = window.devicePixelRatio || 1;
      const physDx = (e.screenX - dragStartScreenX) * dpr;
      const physDy = (e.screenY - dragStartScreenY) * dpr;
      invoke('move_pet_absolute', { x: dragBaseX + physDx, y: dragBaseY + physDy });
    });
    document.addEventListener('mouseup', e => {
      if (!isDragging || e.button !== 0) return;
      isDragging = false;
      dragBaseReady = false;
      if (hasMoved) { isFalling = true; fallVelocity = 0; changeState('fall'); }
      else { changeState('idle'); }
    });

    // ---- Sprite ----
    // For non-standard spritesheets: { w, h } override raw size, { rowH } overrides
    // individual row heights (0=idle, 1=walk, 2=drag, 3=fall). Default: 4 equal rows.
    const SPRITE_ADJUST = { 'shiba': { bsH: 530 } };

    async function applySprite(sprite) {
      let url;
      if (sprite.is_preset) {
        url = sprite.url;
      } else {
        try {
          const b64 = await invoke('read_sprite_preview', { path: sprite.url });
          url = `data:image/png;base64,${b64}`;
        } catch (e) {
          console.error('Failed to load user sprite:', e);
          return;
        }
      }
      const adj = SPRITE_ADJUST[sprite.id] || {};
      const fw = sprite.w / 4;
      const scale = DISPLAY_SIZE / fw;
      const bsW = Math.round(sprite.w * scale);
      const bsH = adj.bsH || Math.round(sprite.h * scale);
      const fh = bsH / 4;
      frameH = Math.round(fh);

      petEl.style.width = DISPLAY_SIZE + 'px';
      petEl.style.height = DISPLAY_SIZE + 'px';
      petEl.style.backgroundImage = `url(${url})`;
      petEl.style.backgroundSize = `${bsW}px ${bsH}px`;
      // Store row offsets for changeState
      petEl._rowY = [0, -frameH, -2 * frameH, -3 * frameH];
      petEl.setAttribute('data-sprite', sprite.id);
      let styleEl = document.getElementById('dyn-keyframes');
      if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'dyn-keyframes'; document.head.appendChild(styleEl); }
      styleEl.textContent = `@keyframes sprite-x-anim { from { background-position-x: 0px; } to { background-position-x: -${bsW}px; } }`;
      const st = currentState; petEl.className = ''; void petEl.offsetWidth; changeState(st);
    }

    // Initialize position first, then settings, then start AI
    invoke('get_position').then(() => {
      // Wait a tick for window-position event to be processed
      return new Promise(resolve => setTimeout(resolve, 50));
    }).then(() => {
      // Sync currentX/Y from windowStartX/Y if still at origin
      if (currentX === 0 && currentY === 0 && (windowStartX !== 0 || windowStartY !== 0)) {
        currentX = windowStartX;
        currentY = windowStartY;
      }
      return invoke('get_settings');
    }).then(s => {
      aiEnabled = s.ai_enabled; followEnabled = s.follow_enabled; chaseEnabled = s.chase_enabled;
      speed = BASE_SPEED * s.speed_multiplier;
      plannedSpeed = speed;
      if (s.sprite) applySprite(s.sprite);
      if (aiEnabled && !followEnabled) scheduleBrain();
    });
  </script>
</body>
</html>
